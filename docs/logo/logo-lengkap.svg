<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 512" width="1120" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4BDB"/>
      <stop offset="1" stop-color="#1B1F5E"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EF2C0"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <!-- Ikon aplikasi -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <!-- Notch -->
    <path d="M146 16 H366 V44 A34 34 0 0 1 332 78 H180 A34 34 0 0 1 146 44 Z" fill="#0B0F1A"/>
    <circle cx="256" cy="47" r="9" fill="#5EF2C0"/>
    <circle cx="256" cy="47" r="15" fill="none" stroke="#5EF2C0" stroke-opacity=".35" stroke-width="3"/>
  </g>

  <!-- Cincin fokus -->
  <circle cx="256" cy="302" r="112" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="30"/>
  <circle cx="256" cy="302" r="112" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="500 704" transform="rotate(-90 256 302)"/>
  <circle cx="256" cy="302" r="22" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="548" y="270" font-family="'Segoe UI Variable Display','Segoe UI',Arial,sans-serif" font-size="108" font-weight="700" fill="#1B1F5E">Notch<tspan fill="#3B4BDB">Focus</tspan></text>
  <text x="552" y="334" font-family="'Segoe UI Variable Text','Segoe UI',Arial,sans-serif" font-size="36" fill="#5B6280">Belajar fokus, tanpa distraksi</text>
</svg>
