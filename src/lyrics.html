<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lirik</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: system-ui, "Segoe UI", Arial, sans-serif; color: #f2f2f2; }
  body { height: 100vh; display: flex; flex-direction: column; }
  .popup {
    flex: 1; display: flex; flex-direction: column; margin: 0;
    background: rgba(20, 20, 25, 0.95); border: 1px solid rgba(255,255,255,0.18); border-radius: 18px;
    overflow: hidden;
  }
  .popup-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid #27272a; cursor: grab;
  }
  .popup-head strong { flex: 1; font-size: 15px; }
  .popup-head button {
    background: #2a2a35; color: #f2f2f2; border: none; border-radius: 8px;
    padding: 5px 10px; cursor: pointer; font-size: 13px;
  }
  .track { padding: 14px 16px 4px; }
  .track-title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { color: #a1a1aa; font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lyrics {
    flex: 1; margin: 10px 16px 16px; padding-right: 6px;
    font-size: 15px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere;
    overflow-y: auto; scrollbar-width: thin;
  }
  .lyrics.hint { color: #a1a1aa; }
</style>
</head>
<body>
  <div class="popup">
    <div class="popup-head" data-tauri-drag-region>
      <strong>Lirik</strong>
      <button id="lyrics-close" type="button">Tutup</button>
    </div>
    <div class="track">
      <div id="lyrics-title" class="track-title">Belum ada lagu</div>
      <div id="lyrics-artist" class="track-artist"></div>
    </div>
    <div id="lyrics-text" class="lyrics hint">Buka lewat tombol Lirik di halaman Musik saat lagu diputar.</div>
  </div>
  <script>
    (function () {
      function stripTimestamps(synced) {
        return synced.split(/\r?\n/).map(function (line) {
          return line.replace(/^\[\d+:\d+(?:\.\d+)?\]\s*/, "");
        }).join("\n").trim();
      }
      function setLyrics(text, isHint) {
        var el = document.getElementById("lyrics-text");
        el.textContent = text;
        el.classList.toggle("hint", !!isHint);
      }
      function loadLyrics(title, artist) {
        document.getElementById("lyrics-title").textContent = title || "Belum ada lagu";
        document.getElementById("lyrics-artist").textContent = artist || "";
        setLyrics("Memuat lirik…", true);
        var url = "https://lrclib.net/api/get?artist_name=" + encodeURIComponent(artist || "") +
          "&track_name=" + encodeURIComponent(title || "");
        fetch(url).then(function (r) {
          if (!r.ok) { throw new Error("not found"); }
          return r.json();
        }).then(function (data) {
          var text = (data && data.plainLyrics) ? data.plainLyrics.trim() : "";
          if (!text && data && data.syncedLyrics) { text = stripTimestamps(data.syncedLyrics); }
          if (text) { setLyrics(text, false); }
          else { setLyrics("Lirik tidak ditemukan di database lirik gratis untuk lagu ini.", true); }
        }).catch(function () {
          setLyrics("Gagal memuat lirik. Periksa koneksi internet, lalu tekan tombol Lirik lagi.", true);
        });
      }
      try {
        if (window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen) {
          window.__TAURI__.event.listen("nfp-lyrics-track", function (e) {
            var t = (e && e.payload) || {};
            loadLyrics(t.title || "", t.artist || "");
          });
        }
      } catch (e) {}
      document.getElementById("lyrics-close").addEventListener("click", function () {
        try {
          if (window.__TAURI__ && window.__TAURI__.window) {
            window.__TAURI__.window.getCurrentWindow().hide();
          }
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
