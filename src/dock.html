<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: system-ui, "Segoe UI", Arial, sans-serif; overflow: hidden; }
  body { display: flex; justify-content: center; align-items: flex-end; height: 100vh; padding-bottom: 6px; }
  .dock {
    display: flex; gap: 6px; align-items: flex-end;
    /* v0.15: dock lebih lebar (~720px, kira-kira 2x desain lama) tapi
       tinggi tetap ramping; lebar tumbuh dinamis bila ikon bertambah. */
    min-width: 720px; justify-content: space-evenly;
    /* v0.15: tema Gelap jadi default (abu-abu #4A4A4F, bukan hitam pekat). */
    background: #4A4A4F;
    border: 1px solid #626268;
    border-radius: 20px; padding: 7px 10px;
  }
  /* v0.15: tema Terang — bilah putih/translusen + blur + teks gelap. */
  .dock.light {
    background: rgba(255, 255, 255, 0.88);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    backdrop-filter: blur(14px) saturate(1.4);
    border-color: #DCDDE2;
  }
  .dock.light .dock-btn { background: #f2f2f4; color: #1c1c1e; }
  .dock.light .dock-btn[data-page="music"] { color: #2563eb; }
  .dock.light .dock-btn[data-page="focus"] { color: #ea580c; }
  .dock.light .dock-btn[data-page="water"] { color: #0284c7; }
  .dock.light .dock-btn[data-page="todo"] { color: #16a34a; }
  .dock.light .dock-btn[data-page="shelf"] { color: #b45309; }
  .dock.light .dock-btn[data-page="status"] { color: #7c3aed; }
  .dock.light .dock-btn#dock-explorer { color: #ca8a04; }
  .dock.light .dock-btn#dock-hide { color: #6b7280; }
  .dock.light .sep { background: rgba(0, 0, 0, 0.15); }
  .dock.light .dock-btn .tip { background: #fff; color: #111; border: 1px solid #DCDDE2; }
  .dock-btn .dot {
    position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.9;
  }
  .dock-btn {
    position: relative; width: 48px; height: 48px; border: none; border-radius: 12px;
    background: #2a2a35; color: #f2f2f2; cursor: pointer; padding: 7px;
    transition: transform 0.15s ease;
  }
  .dock-btn:hover { transform: scale(1.35) translateY(-6px); }
  /* v0.17: tombol dock tidak boleh memunculkan garis fokus saat
     diklik/dihover — dock adalah chrome, bukan konten panel. */
  .dock-btn:focus, .dock-btn:focus-visible { outline: none; }
  .dock-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dock-btn .tip {
    position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%);
    background: #111; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 8px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
  }
  .dock-btn:hover .tip { opacity: 1; }
  .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,0.25); margin: 6px 2px; }
</style>
</head>
<body>
  <nav class="dock" aria-label="Dock">
    <button class="dock-btn" type="button" data-page="music"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></svg><span class="tip">Musik</span></button>
    <button class="dock-btn" type="button" data-page="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tip">Pomodoro</span></button>
    <button class="dock-btn" type="button" data-page="water"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 1 1-12 0c0-4 3-7 6-11z"/></svg><span class="tip">Air</span></button>
    <button class="dock-btn" type="button" data-page="todo"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg><span class="tip">Tugas</span></button>
    <button class="dock-btn" type="button" data-page="shelf"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="tip">Shelf</span></button>
    <button class="dock-btn" type="button" data-page="status"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span class="tip">Status</span></button>
    <span class="sep" aria-hidden="true"></span>
    <!-- v0.15: ikon aplikasi yang dibuka dari Shelf muncul di sini. -->
    <span id="dock-apps" style="display:contents"></span>
    <span class="sep" id="dock-apps-sep" style="display:none" aria-hidden="true"></span>
    <button class="dock-btn" type="button" id="dock-explorer"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/></svg><span class="tip">File Explorer</span></button>
    <button class="dock-btn" type="button" id="dock-hide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span class="tip">Sembunyikan Dock</span></button>
  </nav>
  <script>
    // v0.10: pas-kan ukuran jendela persis ke pil Dock, lalu posisikan
    // ulang di bawah-tengah — tidak ada area jendela kosong yang bisa
    // tampil sebagai kotak putih.
    // v0.12: tinggi jendela = tinggi pil + padding bawah body (6px),
    // karena tinggi pil saja membuat isi meluber 6px dan memunculkan
    // scrollbar vertikal (yang lalu memicu scrollbar horizontal).
    // v0.15: dijadikan fungsi agar bisa dipanggil ulang tiap ikon dock
    // bertambah (lebar dock tumbuh dinamis, tetap bawah-tengah).
    function fitDockWindow() {
      try {
        if (window.__TAURI__ && window.__TAURI__.window) {
          var win = window.__TAURI__.window.getCurrentWindow();
          var pill = document.querySelector(".dock");
          /* v0.17: ukuran jendela HARUS bilangan bulat dan sama persis
             dengan konten — tepi fraksional di DPI scaling bisa tampil
             sebagai garis terang di sudut dock. */
          var w = Math.round(pill ? pill.offsetWidth : 460);
          var h = Math.round(pill ? pill.offsetHeight + 6 : 70);
          win.setSize(new window.__TAURI__.window.LogicalSize(w, h)).catch(function () {});
          if (win.currentMonitor) {
            win.currentMonitor().then(function (m) {
              if (!m) { return; }
              var mw = m.size.width / (m.scaleFactor || 1);
              var mh = m.size.height / (m.scaleFactor || 1);
              win.setPosition(new window.__TAURI__.window.LogicalPosition(Math.round((mw - w) / 2), Math.round(mh - h - 48))).catch(function () {});
            }).catch(function () {});
          }
        }
      } catch (e) {}
    }
    fitDockWindow();
    (function () {
      function invoke(name, args) {
        try {
          if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
            return window.__TAURI__.core.invoke(name, args || {});
          }
        } catch (e) {}
        return Promise.resolve(null);
      }
      function emit(name, payload) {
        try {
          if (window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.emit) {
            return window.__TAURI__.event.emit(name, payload);
          }
        } catch (e) {}
        return Promise.resolve(null);
      }
      document.querySelectorAll("[data-page]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          emit("nfp-open-page", { page: btn.getAttribute("data-page") });
        });
      });
      document.getElementById("dock-explorer").addEventListener("click", function () {
        invoke("open_path", { path: "C:\\" });
      });
      document.getElementById("dock-hide").addEventListener("click", function () {
        emit("nfp-dock-hidden", {}).then(function () {
          try {
            if (window.__TAURI__ && window.__TAURI__.window) {
              window.__TAURI__.window.getCurrentWindow().hide();
            }
          } catch (e) {}
        });
      });
    })();
    // ---------- v0.15: tema dock + aplikasi Shelf di dock ----------
    (function () {
      function invoke(name, args) {
        try {
          if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
            return window.__TAURI__.core.invoke(name, args || {});
          }
        } catch (e) {}
        return Promise.resolve(null);
      }
      function listen(name, fn) {
        try {
          if (window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen) {
            return window.__TAURI__.event.listen(name, fn);
          }
        } catch (e) {}
        return Promise.resolve(null);
      }
      // Tema: dibaca dari localStorage saat muat, dan diperbarui live
      // lewat event "nfp-dock-theme" dari jendela utama.
      function applyTheme(t) {
        var pill = document.querySelector(".dock");
        if (pill) { pill.classList.toggle("light", t === "light"); }
      }
      try { applyTheme(window.localStorage.getItem("nfp_dock_theme") || "dark"); } catch (e) {}
      listen("nfp-dock-theme", function (e) {
        var t = e && e.payload && e.payload.theme;
        if (t === "light" || t === "dark") {
          try { window.localStorage.setItem("nfp_dock_theme", t); } catch (err) {}
          applyTheme(t);
        }
      });
      // Aplikasi yang dibuka dari Shelf: ikon + titik indikator jalan,
      // cegah dobel per path, klik ikon membuka lagi path itu.
      var apps = [];
      function appName(path) {
        var parts = String(path).split(/[\\\/]/).filter(Boolean);
        var base = parts.length ? parts[parts.length - 1] : String(path);
        return base.replace(/\.(exe|lnk|bat|cmd)$/i, "");
      }
      function renderDockApps() {
        var wrap = document.getElementById("dock-apps");
        var sep = document.getElementById("dock-apps-sep");
        if (!wrap) { return; }
        wrap.innerHTML = "";
        apps.forEach(function (a) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "dock-btn";
          b.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg><span class="tip"></span><span class="dot"></span>';
          b.querySelector(".tip").textContent = a.name;
          b.title = a.name;
          b.addEventListener("click", function () { invoke("open_path", { path: a.path }); });
          wrap.appendChild(b);
        });
        if (sep) { sep.style.display = apps.length ? "" : "none"; }
        fitDockWindow();
      }
      function addDockApp(path) {
        if (!path) { return; }
        if (apps.some(function (a) { return a.path === path; })) { return; }
        apps.push({ path: path, name: appName(path) });
        try { window.localStorage.setItem("nfp_dock_apps", JSON.stringify(apps)); } catch (e) {}
        renderDockApps();
      }
      try {
        var saved = JSON.parse(window.localStorage.getItem("nfp_dock_apps") || "[]");
        if (Array.isArray(saved)) {
          apps = saved.filter(function (a) { return a && a.path; }).map(function (a) {
            return { path: a.path, name: a.name || appName(a.path) };
          });
        }
      } catch (e) {}
      listen("nfp-dock-app-added", function (e) {
        var p = e && e.payload && e.payload.path;
        if (p) { addDockApp(p); }
      });
      renderDockApps();
    })();
  </script>
</body>
</html>
