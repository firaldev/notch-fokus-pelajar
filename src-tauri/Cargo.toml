[package]
name = "notch-fokus-pelajar"
version = "0.7.0"
description = "Notch Fokus Pelajar — notch ringan di atas layar Windows untuk pelajar"
authors = ["Notch Fokus Pelajar"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wlanapi", "winerror"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
